	<body>
		<div id="app">
			<transition name="fade" mode="out-in">
				<div class="card" :key="currentIndex">
					<!--div class="card-header"><i class="material-icons">face</i><i class="material-icons">clock</i><div class="title">{{ currentCard.title }}</div><div class="options">{{ currentCard.options }}</div></div>-->
					<div class="card-header">
						<div class="header-left">
							<i class="material-icons icon-inline">access_time</i>
							<span>{{ globalHeaderText }}</span>
						</div>
						<div class="header-right">
							<span 
								v-for="(item, index) in currentCard.rightItems" 
								:key="index"
								:class="{ 'clickable-title': item.link !== undefined }"
								@click="item.link !== undefined && navigateToCard(item.link)"
							>
								{{ item.text }}
							</span>
							
							<!-- separator except for last item -->
							<template v-if="currentCard.rightItems.length > 1">
								<span v-for="(item, idx) in currentCard.rightItems" 
									v-if="idx < currentCard.rightItems.length - 1" 
									:key="'sep-' + idx"
									class="header-separator">
								<i class="material-icons icon-inline">more_vert</i>
								</span>
							</template>
						</div>
						
					</div>
					<div class="card-content">
						<!-- FULL Layout -->
						<!-- FULL Layout -->
						<div v-if="currentCard.layout === 'full'" class="content-full">
							<component
								:is="currentCard.component"
								:data="currentCard.data"
								:prev-index="currentIndex > 0 ? currentIndex - 1 : 0"
								v-on="getComponentListeners()"
							/>
						</div>
						<!-- SPLIT Layout -->
						<div v-else-if="currentCard.layout === 'split'" class="content-split">
							<div class="left-pane">
								<component :is="currentCard.component.left" :data="currentCard.data.left"></component>
							</div>
							<div class="right-pane">
								<component
									:is="currentCard.component.right"
									:data="currentCard.data.right"
									v-on="getComponentListeners()"
								/>
							</div>
						</div>
					</div>
				</div>
			</transition>

				<button class="btn btn-success btn-rounded-md" @click="prevCard" :disabled="currentIndex === 0">Anterior</button>
				<button class="btn btn-success btn-rounded-md btn-home" v-if="currentIndex !== 0" @click="goHome">Inicio</button>
				<button class="btn btn-success btn-rounded-md" @click="nextCard" :disabled="currentIndex === cards.length - 1">Siguiente</button>
			</div>
			<div class="counter"> Card {{ currentIndex + 1 }} of {{ cards.length }}

			function showToast(msg) {
				const toast = document.getElementById('toast');
				toast.textContent = msg;
				toast.classList.add('show');
				setTimeout(() => {
					toast.classList.remove('show');
				}, 3000);

					currentCard() {

					nextCard() {
						if (this.currentIndex < this.cards.length - 1) {
							this.currentIndex++;
						}
					},
					prevCard() {
						if (this.currentIndex > 0) {
							this.currentIndex--;
						}
					},
					goHome() {
						this.currentIndex = 0;
					},
					navigateIfLinked() {
						if (this.currentCard.titleLink !== undefined) {
							this.navigateToCard(this.currentCard.titleLink);
						}
					},
					navigateToCard(index) {
						if (index >= 0 && index < this.cards.length) {
							this.currentIndex = index;
						} else {
							showToast(`No existe la tarjeta con índice ${index + 1}`);
							console.warn(`Índice fuera de rango: ${index}`);
						}
					},
					handleCreate(payload) {
						showToast(`Create event received: ${JSON.stringify(payload)}`);
					},
					
					handleCancel() {
						showToast('Cancelled');
					},
					getComponentListeners() {
						return {
							create: this.handleCreate,
							cancel: this.handleCancel,
							navigate: this.navigateToCard
						};
					}
				}
