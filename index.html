<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Vue Card UI</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <transition name="fade" mode="out-in">
      <card-wrapper :key="currentIndex" :card="currentCard"></card-wrapper>
    </transition>

    <div class="buttons">
      <button @click="prevCard" :disabled="currentIndex === 0">◀ Prev</button>
      <button @click="nextCard" :disabled="currentIndex === cards.length - 1">Next ▶</button>
    </div>
    <div class="counter">
      Card {{ currentIndex + 1 }} of {{ cards.length }}
    </div>
  </div>

  <!-- Load components -->
  <script type="module">
	import { CardWrapper } from './components/CardWrapper.js';
    import { FormExample } from './components/FormExample.js';
    import { TableExample } from './components/TableExample.js';
    import { ImageFull } from './components/ImageFull.js';
    import { ImageSplit } from './components/ImageSplit.js';
	import { LabeledInput } from './components/LabeledInput.js';
	import { iPodForm } from './components/iPodForm.js';


    const app = Vue.createApp({
      components: {
        CardWrapper
      },
      data() {
        return {
          currentIndex: 0,
          cards: [
            {
              title: 'Form Card',
              options: 'Edit | Save',
              layout: 'full',
              component: FormExample,
              data: {}
            },
            {
              title: 'Table Card',
              options: 'Export',
              layout: 'full',
              component: TableExample,
              data: [
                { name: 'Alice', age: 25 },
                { name: 'Bob', age: 30 },
                { name: 'Charlie', age: 35 }
              ]
            },
            {
              title: 'Full Image Card',
              options: '',
              layout: 'full',
              component: ImageFull,
			  data: { src: './resources/QR.png' }
            },
            {
              title: 'Split Image + Form',
              options: 'View | Fill',
              layout: 'split',
              component: {
                left: ImageSplit,
                right: FormExample
              },
              data: {
                left: {
                  src: 'https://via.placeholder.com/400x300?text=Split+Image',
                  caption: 'Left pane image'
                },
                right: {}
              }
            },
			{
				title: 'iPod Form Card',
				options: 'Submit',
				layout: 'split',
				component: {
					left: ImageFull,
					right: iPodForm
				},
				data: {
					left: { src: 'https://via.placeholder.com/400x300?text=iPod+Form+Image' },
					right: {}
				}
			}
          ]
        };
      },
      computed: {
        currentCard() {
          return this.cards[this.currentIndex];
        }
      },
      methods: {
        nextCard() {
          if (this.currentIndex < this.cards.length - 1) this.currentIndex++;
        },
        prevCard() {
          if (this.currentIndex > 0) this.currentIndex--;
        }
      }
    });

    app.mount('#app');
  </script>
</body>
</html>
